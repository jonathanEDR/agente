[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunat-launcher-agent"
version = "1.0.0"
description = "Agente local del SaaS: cifra, descifra y abre Chrome en SUNAT SOL."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "cryptography>=42",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pystray>=0.19",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6.10"]

[project.scripts]
sunat-agente = "sunat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
